<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notch Engine Sandbox — LP-Conf</title>
    <meta
      name="description"
      content="Ambiente isolado de validação e demonstração do motor modular de entalhes côncavos (NotchContainer)."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("lp-conf-theme");
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="sandbox-root"></div>
    <script type="module" src="/src/sandbox.tsx"></script>
  </body>
</html>
